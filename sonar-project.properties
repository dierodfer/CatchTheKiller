sonar.projectKey=dierodfer_CatchTheKiller
sonar.organization=dierodfer

sonar.sources=src
sonar.exclusions=dist/**,node_modules/**

# ─── Exclusiones de reglas ────────────────────────────────────────────────
#
# S1135 ("Complete the task associated to this TODO comment") busca la palabra
# TODO en los comentarios. Este proyecto está documentado ÍNTEGRAMENTE en
# español, donde «todo» es una palabra corriente —"en todo el tablero", "a todo
# color", "del todo"—, así que la regla marcaba una decena de comentarios que
# no son tareas pendientes ni lo han sido nunca. No hay forma de afinar el
# patrón de la regla, y reescribir la prosa para esquivar una de las palabras
# más comunes del idioma empeoraría los comentarios sin ganar nada.
#
# Si algún día hace falta registrar trabajo pendiente en el código, el sitio es
# una issue de GitHub, que además no se pierde en un `grep`.
sonar.issue.ignore.multicriteria=s1135
sonar.issue.ignore.multicriteria.s1135.ruleKey=javascript:S1135
sonar.issue.ignore.multicriteria.s1135.resourceKey=**/*
