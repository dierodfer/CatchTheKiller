name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 24, igual que deploy.yml: jsdom@30 (Vitest + Testing Library)
          # requiere Node ^22.22.2 || ^24.15.0 || >=26 en tiempo de ejecución,
          # no solo en `engines` — con Node 20 el runtime falla de verdad
          # (`undici` usa una API de `node:util` que no existe ahí), no es
          # un aviso ignorable.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Logic tests
        run: npm run test:logic

      - name: Build
        run: npm run build
